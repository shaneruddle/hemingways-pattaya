name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_ID: hemingways-pattaya-9a576
  SERVICE: hemingways-pattaya
  REGION: asia-southeast1
  IMAGE: asia-southeast1-docker.pkg.dev/hemingways-pattaya-9a576/hemingways-pattaya/app

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # Switched from Workload Identity Federation to a plain service account
          # key. WIF impersonation kept failing with a 403 on
          # iam.serviceAccounts.getAccessToken despite correct IAM bindings, a
          # correct attribute mapping/CEL condition, and an org policy override —
          # never conclusively diagnosed. A downloadable key is simpler and avoids
          # the whole impersonation chain; it requires the GCP_SA_KEY secret
          # (the full JSON key for github-actions-deploy@hemingways-pattaya-9a576.iam.gserviceaccount.com)
          # and the iam.managed.disableServiceAccountKeyCreation org policy to be
          # overridden (not enforced) for this project, which it now is.
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --tag "${{ env.IMAGE }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE }}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            FIREBASE_PROJECT_ID=hemingways-pattaya-9a576
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}

      - name: Show deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
